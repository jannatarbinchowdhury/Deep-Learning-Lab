<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BDT Fake Currency Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
    }
    p.sub { color: #94a3b8; margin-bottom: 30px; text-align: center; }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop-zone:hover { border-color: #38bdf8; }
    .drop-zone input { display: none; }
    .drop-zone span { color: #64748b; font-size: 0.95rem; }
    #preview {
      margin-top: 20px;
      width: 100%;
      border-radius: 10px;
      display: none;
      max-height: 250px;
      object-fit: contain;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0ea5e9; }
    #result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }
    #result.real { background: #052e16; border: 1px solid #16a34a; }
    #result.fake { background: #2d0a0a; border: 1px solid #dc2626; }
    #result .verdict { font-size: 1.6rem; font-weight: bold; margin-bottom: 6px; }
    #result.real .verdict { color: #4ade80; }
    #result.fake .verdict { color: #f87171; }
    #result .conf { color: #94a3b8; font-size: 0.9rem; }
    .loading { color: #94a3b8; text-align: center; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <h1>🇧🇩 BDT Fake Note Detector</h1>
  <p class="sub">Upload a Bangladesh Taka image to check if it's real or fake</p>

  <div class="card">
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)"/>
      <span>📷 Click to upload currency image<br/>(JPG / PNG)</span>
    </div>

    <img id="preview" src="" alt="Preview"/>

    <button onclick="detectCurrency()">🔍 Detect Now</button>

    <div class="loading" id="loading">⏳ Analyzing image...</div>

    <div id="result">
      <div class="verdict" id="verdict"></div>
      <div class="conf" id="conf"></div>
    </div>
  </div>

  <script>
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById('preview');
        img.src = e.target.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
      document.getElementById('result').style.display = 'none';
    }

    async function detectCurrency() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) {
        alert('Please select an image first!');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').style.display = 'none';

      try {
        const res = await fetch('/detect', { method: 'POST', body: formData });
        const data = await res.json();

        const resultDiv = document.getElementById('result');
        document.getElementById('verdict').textContent =
          data.label === 'REAL' ? '✅ REAL Currency' : '❌ FAKE Currency';
        document.getElementById('conf').textContent =
          `Confidence: ${data.confidence}%`;
        resultDiv.className = data.label === 'REAL' ? 'real' : 'fake';
        resultDiv.style.display = 'block';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
  </script>
</body>
</html>
